name: conjur-poc

# Conjur OSS (external to the cluster) + app Postgres, for local phases 1-2.
# Secrets come from .env (git-ignored). Image tags are pinned; do not use "latest".

services:

  # --- Conjur backend database (internal only, never published) ---
  conjur-db:
    image: postgres:15-alpine
    container_name: conjur_db
    environment:
      POSTGRES_DB: conjur
      POSTGRES_USER: conjur
      POSTGRES_PASSWORD: ${CONJUR_DB_PASSWORD:?set CONJUR_DB_PASSWORD in .env}
    volumes:
      - conjur_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conjur -d conjur"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - conjur-net
    restart: unless-stopped

  # --- Conjur OSS server (plain HTTP inside the network; TLS terminated by the proxy) ---
  conjur:
    image: cyberark/conjur:1.27.0
    container_name: conjur_server
    command: server
    environment:
      DATABASE_URL: postgres://conjur:${CONJUR_DB_PASSWORD}@conjur-db/conjur
      CONJUR_DATA_KEY: ${CONJUR_DATA_KEY:?set CONJUR_DATA_KEY in .env}
    depends_on:
      conjur-db:
        condition: service_healthy
    networks:
      - conjur-net
    restart: unless-stopped

  # --- TLS proxy: the only Conjur entry point exposed to the host ---
  proxy:
    image: nginx:1.28-alpine
    container_name: conjur_proxy
    ports:
      # Loopback only for phases 1-2. In phase 3 (CRC Pod -> Mac host) this binding must be revisited.
      - "127.0.0.1:8443:443"
    volumes:
      - ./conf/conjur.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      - conjur
    networks:
      - conjur-net
    restart: unless-stopped

  # --- Conjur CLI, used only to load policy and manage identities ---
  client:
    image: cyberark/conjur-cli:8
    container_name: conjur_client
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ./policy:/policy:ro
    depends_on:
      - proxy
    networks:
      - conjur-net

  # --- Application database (Spring Data JPA, phases 1-2 run the app on the host) ---
  app-db:
    image: postgres:15-alpine
    container_name: app_db
    environment:
      POSTGRES_DB: pocdb
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    ports:
      # 5433 avoids postgres other inst conflict
      - "127.0.0.1:5433:5432"
    volumes:
      - app_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc -d pocdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-net
    restart: unless-stopped

networks:
  conjur-net:
  app-net:

volumes:
  conjur_db_data:
  app_db_data: